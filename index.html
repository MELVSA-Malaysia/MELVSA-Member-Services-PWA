<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24486f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MELVSA">
<meta name="application-name" content="MELVSA">
<title>MELVSA</title>
<link rel="manifest" href="./manifest.webmanifest?v=10">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/melvsa-180.png?v=8">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/melvsa-192.png?v=8">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="dns-prefetch" href="//script.google.com">
<link rel="dns-prefetch" href="//script.googleusercontent.com">
<style>
html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#eef5f9}
#portal{display:block;width:100%;height:100%;border:0;background:#eef5f9}
</style>
</head>
<body>
<iframe id="portal" src="about:blank" data-src="https://script.google.com/macros/s/AKfycbwI4oyjVug1N-R23KM6I-MBGvp36Pi6j5qRg1TWuS2pnYlCG87l63hUEfRhep1Z_OhADA/exec" title="MELVSA Member Services" allow="clipboard-read; clipboard-write" fetchpriority="high"></iframe>
<script>
const SESSION_KEY="melvsaMemberSession";
const portal=document.getElementById("portal");
function savedSession(){let s="";try{s=localStorage.getItem(SESSION_KEY)||""}catch(x){}if(!s){const m=document.cookie.match(new RegExp("(?:^|; )"+SESSION_KEY+"=([^;]*)"));if(m)s=decodeURIComponent(m[1])}return s}
window.addEventListener("message",function(e){
  const d=e.data||{};
  if(d.type==="MELVSA_SESSION_SET"&&d.session){localStorage.setItem(SESSION_KEY,d.session);try{document.cookie=SESSION_KEY+"="+encodeURIComponent(d.session)+"; Max-Age=2592000; Path=/; SameSite=Lax; Secure"}catch(x){}}
  if(d.type==="MELVSA_SESSION_CLEAR")localStorage.removeItem(SESSION_KEY);
  if(d.type==="MELVSA_SESSION_GET"){
    const s=savedSession();
    document.getElementById("portal").contentWindow.postMessage({type:"MELVSA_SESSION_VALUE",session:s},"*");
  }
});
portal.addEventListener("load",function(){const s=savedSession();if(s)portal.contentWindow.postMessage({type:"MELVSA_SESSION_VALUE",session:s},"*");});
portal.src=portal.dataset.src;
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("./service-worker.js?v=10");});}
</script>
</body>
</html>
