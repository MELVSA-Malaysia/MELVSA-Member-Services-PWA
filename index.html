<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24486f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="MELVSA">
<meta name="application-name" content="MELVSA">
<title>MELVSA</title>
<link rel="manifest" href="./manifest.webmanifest?v=11">
<link rel="apple-touch-icon" sizes="180x180" href="./icons/melvsa-180.png?v=8">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/melvsa-192.png?v=8">
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<link rel="dns-prefetch" href="//script.google.com">
<link rel="dns-prefetch" href="//script.googleusercontent.com">
<style>
html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#eef5f9}
#portal{display:block;width:100%;height:100%;border:0;background:#eef5f9}
</style>
</head>
<body>
<iframe id="portal" src="about:blank" data-src="https://script.google.com/macros/s/AKfycbwI4oyjVug1N-R23KM6I-MBGvp36Pi6j5qRg1TWuS2pnYlCG87l63hUEfRhep1Z_OhADA/exec" title="MELVSA Member Services" allow="clipboard-read; clipboard-write" fetchpriority="high"></iframe>
<script>
const SESSION_KEY="melvsaMemberSession", SESSION_CACHE="melvsa-auth-v1", SESSION_REQ="./__melvsa_session__";
const portal=document.getElementById("portal");
async function saveSession(s){if(!s)return;try{localStorage.setItem(SESSION_KEY,s)}catch(e){}try{const c=await caches.open(SESSION_CACHE);await c.put(SESSION_REQ,new Response(s,{headers:{"Content-Type":"text/plain"}}))}catch(e){}}
async function savedSession(){let s="";try{s=localStorage.getItem(SESSION_KEY)||""}catch(e){}if(!s)try{const c=await caches.open(SESSION_CACHE),r=await c.match(SESSION_REQ);if(r)s=await r.text()}catch(e){}return s}
async function clearSession(){try{localStorage.removeItem(SESSION_KEY)}catch(e){}try{const c=await caches.open(SESSION_CACHE);await c.delete(SESSION_REQ)}catch(e){}}
async function sendSession(){const s=await savedSession();portal.contentWindow.postMessage({type:"MELVSA_SESSION_VALUE",session:s},"*")}
window.addEventListener("message",async function(e){const d=e.data||{};if(d.type==="MELVSA_SESSION_SET"&&d.session){await saveSession(d.session);portal.contentWindow.postMessage({type:"MELVSA_SESSION_SAVED"},"*")}if(d.type==="MELVSA_SESSION_CLEAR")await clearSession();if(d.type==="MELVSA_SESSION_GET")await sendSession()});
portal.addEventListener("load",()=>{sendSession();setTimeout(sendSession,350);setTimeout(sendSession,1200)});
(async()=>{await savedSession();portal.src=portal.dataset.src})();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js?v=11"));}
</script>
</body>
</html>
